name: Full Trending Models Pipeline

on:
  schedule:
    - cron: "0 7 * * 1-5" # Runs Mon to Fri at 9:00 AM CEST / 8:00 AM CET
  workflow_dispatch: # Allows manual triggering

permissions: {}

jobs:
  run-pipeline:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Step 1 - Parse Trending Models
      env:
        SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python 01_parse_trending_models.py

    - name: Step 2 - Custom Code Repos
      env:
        SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: python 04_upstream_transformers.py

    # - name: Step 2 - Process Code for HF Jobs
    #   env:
    #     SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
    #     HF_TOKEN: ${{ secrets.HF_TOKEN }}
    #   run: python 02_process_code.py

